controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    allow_integration_in_goal_trajectories: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      Joint1: {goal: 0.05}
      Joint2: {goal: 0.05}
      Joint3: {goal: 0.05}
      Joint4: {goal: 0.05}
      Joint5: {goal: 0.05}
      Joint6: {goal: 0.05}
