controller_manager:
  ros__parameters:
    update_rate: 50  # 50 Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    allow_integration_in_goal_trajectories: false
    constraints:
      stopped_velocity_tolerance: 0.10
      goal_time: 0.0
      Joint1: {goal: 0.08}
      Joint2: {goal: 0.08}
      Joint3: {goal: 0.08}
      Joint4: {goal: 0.08}
      Joint5: {goal: 0.08}
      Joint6: {goal: 6.28}
    joint_limits:
      Joint1:  {has_position_limits: true, min_position: -2.967, max_position: 2.967,  has_velocity_limits: true, max_velocity: 3.15}
      Joint2:  {has_position_limits: true, min_position: 0.0,    max_position: 2.844887, has_velocity_limits: true, max_velocity: 3.15}
      Joint3:  {has_position_limits: true, min_position: -3.141593, max_position: -0.610865, has_velocity_limits: true, max_velocity: 3.15}
      Joint4:  {has_position_limits: true, min_position: -3.142, max_position: 3.142, has_velocity_limits: true, max_velocity: 3.15}
      Joint5:  {has_position_limits: true, min_position: -1.658, max_position: 1.658, has_velocity_limits: true, max_velocity: 3.15}
      Joint6:  {has_position_limits: true, min_position: -12.566, max_position: 12.566, has_velocity_limits: true, max_velocity: 3.15}
