controller_manager:
  ros__parameters:
    update_rate: 50  # 50 Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
    joint_limits:
      Joint1:  {has_velocity_limits: true,  max_velocity: 3.15}
      Joint2:  {has_velocity_limits: true,  max_velocity: 3.15}
      Joint3:  {has_velocity_limits: true,  max_velocity: 3.15}
      Joint4:  {has_velocity_limits: true,  max_velocity: 3.15}
      Joint5:  {has_velocity_limits: true,  max_velocity: 3.15}
      Joint6:  {has_velocity_limits: true,  max_velocity: 3.15}
